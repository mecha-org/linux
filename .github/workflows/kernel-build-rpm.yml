name: Build and Release Kernel (RPM)

on:
  push:
    branches: ["main", "imx/lf-6.12.20", "pre-release*", "mecha-v7.0-wip", "mecha-7.0-wip*"]
  pull_request:
    branches: ["main", "imx/lf-6.12.20", "pre-release*", "mecha-v7.0-wip", "mecha-7.0-wip*"]
  workflow_dispatch:

jobs:
  build-rpm:
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: write

    container:
      image: fedora:44

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          dnf install -y \
            gcc \
            make \
            bison \
            flex \
            openssl-devel \
            elfutils-libelf-devel \
            elfutils-devel \
            bc \
            rsync \
            rpm-build \
            git \
            findutils \
            hostname \
            tar \
            xz \
            python3 \
            perl \
            openssl \
            dwarves \
            gh

      - name: Configure Git
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git config --global --add safe.directory '*'

      - name: Configure Kernel
        run: |
          cp arch/arm64/configs/mecha_v8_defconfig .config

      - name: Build Kernel
        run: |
          make -j$(nproc)

      - name: Packaging as RPM
        run: |
          # Packaging the build into an RPM package
          # Ensure uncompressed kernel image is used
          make KBUILD_IMAGE=arch/arm64/boot/Image binrpm-pkg -j$(nproc)

      - name: Consolidate Artifacts
        if: always()
        run: |
          mkdir -p dist
          find rpmbuild/RPMS -name "*.rpm" -exec cp {} dist/ \;
          find rpmbuild/SRPMS -name "*.rpm" -exec cp {} dist/ \;

      - name: Upload RPM Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-packages-rpm
          path: ./dist/*.rpm

  release-rpm:
    if: github.event_name != 'pull_request'
    needs: build-rpm
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Download RPM Artifacts
        uses: actions/download-artifact@v5
        with:
          name: kernel-packages-rpm
          path: ./dist

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Create/Update Rolling Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -- ./dist/*.rpm
          if [ ! -e "$1" ]; then
            echo "No RPM artifacts found in ./dist"
            exit 1
          fi

          gh release delete kernel-rpm-latest --yes || true
          gh api \
            --method DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/tags/kernel-rpm-latest" \
            || true

          gh release create kernel-rpm-latest "$@" \
            --target "${GITHUB_SHA}" \
            --title "Latest Kernel RPM Build" \
            --notes "Automated rolling release for latest kernel RPM builds." \
            --prerelease
