name: Build and Release Kernel (RPM)

on:
  push:
    branches: ["fedora*"]
  pull_request:
    branches: ["fedora*"]
  workflow_dispatch:

env:
  PULP_CLI_VERSION: "0.41.1"
  # Every fedora* branch builds; only pushes to fedora-mecha-7.3 upload to the repo.
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/fedora-mecha-7.3' }}

jobs:
  # Every build gets a unique NVR so re-runs and per-commit builds don't
  # collide in the RPM repo. It is computed once so every Fedora target of
  # a run shares the same version. Leading dot matches redhat/Makefile's own
  # ".test" fallback format.
  version:
    name: Resolve build version
    runs-on: ubuntu-24.04-arm
    outputs:
      distlocalversion: ${{ steps.stamp.outputs.distlocalversion }}
    steps:
      - name: Set DISTLOCALVERSION
        id: stamp
        run: echo "distlocalversion=.$(date -u '+%Y%m%d%H%M')" >> "$GITHUB_OUTPUT"

  build-rpm:
    name: kernel rpm (fc${{ matrix.fedora }})
    needs: version
    runs-on: ubuntu-24.04-arm
    environment: canary

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        fedora: [44, 45]

    container:
      image: registry.fedoraproject.org/fedora:${{ matrix.fedora }}

    env:
      FEDORA: ${{ matrix.fedora }}
      # The redhat/ build system (kernel-ark) versions Fedora builds off a
      # "MARKER" upstream git tag and requires an UPSTREAM_BRANCH to exist
      # for its snapshot versioning. Neither exists in this fork's history,
      # so we pin both to build straight off the checked-out HEAD instead.
      DIST: ".fc${{ matrix.fedora }}"
      VERSION_ON_UPSTREAM: "0"
      MARKER: "HEAD"
      DISTLOCALVERSION: ${{ needs.version.outputs.distlocalversion }}
      # Keep the binary build scoped to the base kernel + modules: skip
      # perf/tools/doc/debuginfo/selftests and the kABI stablelist checks.
      WITHOUT_FLAGS: >-
        --without perf --without libperf --without tools --without doc
        --without debuginfo --without debug --without selftests
        --without kernel_abi_stablelists --without kabichk
      MECHA_PULP_USERNAME: ${{ secrets.MECHA_PULP_USERNAME }}
      MECHA_PULP_PASSWORD: ${{ secrets.MECHA_PULP_PASSWORD }}
      MECHA_PULP_API_URL: ${{ vars.MECHA_PULP_API_URL }}
      MECHA_PULP_RPM_CHANNEL: ${{ vars.MECHA_PULP_RPM_CHANNEL }}

    steps:
      # The Fedora image ships without git. actions/checkout needs it present
      # *before* it runs, or it silently falls back to a tarball download
      # with no .git directory -- which breaks every git call in redhat/.
      - name: Install base build dependencies
        run: |
          dnf -y install \
            git make gcc flex bison bzip2 rpm-build \
            python3-pyyaml findutils diffutils gawk m4 \
            perl-interpreter tar xz rsync jq python3

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.email "ci@mechasystems.com"
          git config --global user.name "Mecha CI"

      - name: Render kernel.spec
        run: |
          make DIST="$DIST" VERSION_ON_UPSTREAM="$VERSION_ON_UPSTREAM" MARKER="$MARKER" \
            DISTLOCALVERSION="$DISTLOCALVERSION" dist-spec

      - name: Install kernel BuildRequires
        run: |
          # Query BuildRequires scoped to the same --without flags used for
          # the actual build, then install them. bindgen/hmaccalc are listed
          # under their upstream names in the spec but ship under different
          # names in Fedora's repos.
          buildreqs=$(rpmspec -q --buildrequires $WITHOUT_FLAGS redhat/rpm/SOURCES/kernel.spec \
            | sed -e 's/^bindgen$/bindgen-cli/' -e 's/^hmaccalc$/libkcapi-hmaccalc/' \
            | awk '{print $1}')
          dnf -y install $buildreqs

      - name: Build source RPM
        run: |
          # NO_CONFIGCHECKS bypasses redhat/configs' strict "every visible
          # Kconfig symbol must be set" gate, which currently fails on
          # CONFIG_WLAN_VENDOR_NXP/CONFIG_NXPWIFI/CONFIG_DRM_PANEL_DDIC_CH13726A
          # across every arch/flavor -- those config fragments haven't been
          # updated for the NXP wifi driver yet. Remove this once fixed.
          make DIST="$DIST" VERSION_ON_UPSTREAM="$VERSION_ON_UPSTREAM" MARKER="$MARKER" \
            DISTLOCALVERSION="$DISTLOCALVERSION" NO_CONFIGCHECKS=1 dist-srpm

      - name: Rebuild binary RPMs from SRPM
        run: |
          mkdir -p dist
          srpm=$(find redhat/rpm/SRPMS -name '*.src.rpm' | head -n1)
          if [ -z "$srpm" ]; then
            echo "No source RPM found in redhat/rpm/SRPMS"
            exit 1
          fi
          rpmbuild --rebuild "$srpm" $WITHOUT_FLAGS \
            --define "_rpmdir $PWD/dist" \
            --define "_srcrpmdir $PWD/dist"

      - name: Upload RPM artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: kernel-packages-rpm-fc${{ matrix.fedora }}
          path: dist/**/*.rpm

      - name: Setup | Pulp CLI
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          python3 -m venv /opt/pulp-cli
          /opt/pulp-cli/bin/pip install --quiet "pulp-cli==${PULP_CLI_VERSION}"
          echo "/opt/pulp-cli/bin" >> "$GITHUB_PATH"

      - name: Configure Pulp CLI
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          PULP_API_URL="$(printf '%s' "${MECHA_PULP_API_URL}" | tr -d '[:space:]')"
          PULP_API_URL="${PULP_API_URL%/}"
          if [ -z "$PULP_API_URL" ]; then
            echo "MECHA_PULP_API_URL is empty after trimming whitespace"
            exit 1
          fi
          [ -n "$MECHA_PULP_RPM_CHANNEL" ] || { echo "MECHA_PULP_RPM_CHANNEL is empty"; exit 1; }

          pulp config create \
            --username "$MECHA_PULP_USERNAME" \
            --password "$MECHA_PULP_PASSWORD" \
            --base-url "$PULP_API_URL" \
            --overwrite

      # Uploading also signs each package (repo signing service) and publishes
      # the repo; the canary distribution follows the repo automatically.
      - name: Publish RPMs to Pulp
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          REPO="repo-rpm-fedora-${FEDORA}-${MECHA_PULP_RPM_CHANNEL}"
          rpms=(dist/**/*.rpm)
          if [ "${#rpms[@]}" -eq 0 ]; then
            echo "No RPMs found in dist/ to publish"
            exit 1
          fi

          for rpm in "${rpms[@]}"; do
            echo "[INFO] Uploading $(basename "$rpm") to $REPO"
            pulp rpm content upload --repository "$REPO" --file "$rpm"
          done

      - name: Verify kernel is served
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          BASE="https://pkg.mecha.so/repo/rpm/fedora-${FEDORA}/${MECHA_PULP_RPM_CHANNEL}"
          core=(dist/**/kernel-core-*.rpm)
          WANT="$(basename "${core[0]}")"
          for _ in $(seq 1 40); do
            PRIMARY=$(curl -fsSL "$BASE/repodata/repomd.xml" | grep -oP 'href="\Krepodata/[^"]*primary\.xml[^"]*')
            if curl -fsSL "$BASE/$PRIMARY" | gzip -dcf | grep "<location href=\"[^\"]*/${WANT}\"" >/dev/null; then
              echo "[INFO] served at $BASE: $WANT"
              exit 0
            fi
            sleep 15
          done
          echo "[ERROR] $WANT not served at $BASE after 10 minutes"
          exit 1
