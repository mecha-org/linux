%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/nxp,imx95-lvds-blk-ctl.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: NXP i.MX95 LVDS Block Control

maintainers:
  - Marek Vasut <marek.vasut@mailbox.org>
  - Peng Fan <peng.fan@nxp.com>

properties:
  compatible:
    items:
      - const: nxp,imx95-lvds-csr
      - const: syscon

  reg:
    maxItems: 1

  power-domains:
    maxItems: 1

  clocks:
    maxItems: 1

  '#clock-cells':
    const: 1
    description:
      The clock consumer should specify the desired clock by having the clock
      ID in its "clocks" phandle cell. See
      include/dt-bindings/clock/nxp,imx95-clock.h

  "#address-cells":
    const: 1

  "#size-cells":
    const: 1

patternProperties:
  "^lvds@[0-9a-f]+$":
    type: object
    additionalProperties: true

    properties:
      compatible:
        const: fsl,imx95-lvds

  "^phy@[0-9a-f]+$":
    type: object
    additionalProperties: true

    properties:
      compatible:
        const: fsl,imx95-ldb

required:
  - compatible
  - reg
  - '#clock-cells'
  - power-domains
  - clocks
  - "#address-cells"
  - "#size-cells"

unevaluatedProperties: false

examples:
  - |
    syscon@4c410000 {
      compatible = "nxp,imx95-lvds-csr", "syscon";
      #address-cells = <1>;
      #size-cells = <1>;
      reg = <0x4b0c0000 0x10000>;
      #clock-cells = <1>;
      clocks = <&scmi_clk 76>;
      power-domains = <&scmi_devpd 13>;
    };
...
